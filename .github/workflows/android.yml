name: Build AlphaTrainer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - android-app
    paths:
      - 'android_app/**'
      - 'cloud/**'
      - 'alpha_math/**'
      - 'checkpoints/**'
      - 'core/**'
      - 'data/**'
      - 'evaluation/**'
      - 'language/**'
      - 'learning/**'
      - 'models/**'
      - 'neural/**'
      - 'registry/**'
      - 'training/**'
      - 'transformer/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \

      - name: Verificar Apache Ant
        run: |
          ant -version
          which ant
          ls -l /usr/bin/ant            git zip unzip ant \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "Cython==0.29.36"

      - name: Preparar codigo e configuracao
        env:
          FIREBASE_API_KEY: ${{ secrets.ALPHATRAINER_FIREBASE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$FIREBASE_API_KEY" || (echo "Falta ALPHATRAINER_FIREBASE_API_KEY" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Falta SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Falta SUPABASE_PUBLISHABLE_KEY" && exit 1)
          python android_app/prepare_android.py

      - name: Compilar APK
        working-directory: android_app
        run: buildozer -v android debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaTrainer-APK
          path: android_app/bin/*.apk
          if-no-files-found: error
          retention-days: 14
