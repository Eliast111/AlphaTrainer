
name: Build AlphaTrainer Flet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - android-app
    paths:
      - 'flet_app.py'
      - 'pyproject.toml'
      - 'core/**'
      - 'alpha_math/**'
      - 'checkpoints/**'
      - 'data/**'
      - 'learning/**'
      - 'training/**'
      - 'neural/**'
      - 'models/**'
      - 'registry/**'
      - 'evaluation/**'
      - 'transformer/**'
      - '.github/workflows/flet-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --python 3.14 --no-install-project

      - name: Check Flet
        run: uv run flet --version

      - name: Build APK
        run: uv run flet build apk --yes --verbose --build-number "${{ github.run_number }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AlphaTrainer-APK
          path: build/apk
          if-no-files-found: error
          retention-days: 14

