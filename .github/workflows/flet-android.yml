name: Build AlphaTrainer Flet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - android-app
    paths:
      - 'flet_app.py'
      - 'pyproject.toml'
      - 'core/**'
      - 'alpha_math/**'
      - 'checkpoints/**'
      - 'data/**'
      - 'learning/**'
      - 'training/**'
      - 'neural/**'
      - 'models/**'
      - 'registry/**'
      - 'evaluation/**'
      - 'transformer/**'
      - '.github/workflows/flet-android.yml'
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
